[package]
name = "instalator"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
# Fără accesskit: biblioteca lui cere Windows 10, iar instalatorul trebuie să pornească pe Windows 8.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.17"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
mslnk = "0.1"
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Foundation", "Win32_UI_Shell", "Wdk_System_SystemServices"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
