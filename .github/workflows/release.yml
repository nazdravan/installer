name: Release

# Push pe `main` → teste. Dacă versiunea din Cargo.toml nu are încă release → build pentru
# Windows și Linux, iar release-ul „Instalator v<versiune>” (tag v<versiune>) se publică cu
# instalator-<versiune>-windows.zip, instalator-<versiune>-linux.zip și SHA256SUMS.txt.
# Furnica și Cangurul se descarcă din ultimele lor release-uri publicate.
# Pornit manual (workflow_dispatch): build și teste pe orice ramură, fără release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.published.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Citește versiunea
        run: |
          v="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml | head -1)"
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "### Instalator v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"
      # Un release publicat nu se suprascrie: la un push obișnuit se rulează doar testele.
      - id: published
        name: Verifică dacă versiunea e deja publicată
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.v.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          build=true
          if [ "$EVENT" = push ] &&
            draft="$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" &&
            [ "$draft" != "true" ]; then
            build=false
            echo "Instalator v$VERSION e deja publicat: doar teste. Pentru un release nou schimbați version în Cargo.toml." >>"$GITHUB_STEP_SUMMARY"
          fi
          echo "build=$build" >>"$GITHUB_OUTPUT"

  test:
    timeout-minutes: 30
    name: teste
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependențe de sistem
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: i686-pc-windows-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test
      - run: cargo test --locked
      # Instalare reală a unui .deb: binarul de test se construiește normal și se rulează ca root
      # (runner-ul are sudo fără parolă), ca target/ și cache-ul să nu primească fișiere de root.
      - name: Instalare reală deb
        run: |
          bin="$(cargo test --locked --no-run --message-format=json | jq -r 'select(.profile.test == true) | .executable' | head -1)"
          sudo "$bin" --ignored real_deb_install
      - name: Codul pentru Windows se compilează
        run: cargo check --locked --target i686-pc-windows-gnu

  assets:
    timeout-minutes: 10
    name: Furnica și Cangurul
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă din release-urile lor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          for app in furnica cangurul; do
            gh release download -R "nazdravan/$app" -D assets \
              --pattern "$app-*-windows7-x86-portable.zip" --pattern "$app-*-linux-x86_64.deb"
          done
          ls -l assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets
          path: assets/*
          if-no-files-found: error

  windows:
    timeout-minutes: 90
    name: Windows 8+ x86
    needs: [version, assets]
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    # Ca la Furnica și Cangurul: Arch cu mingw-w64-gcc pentru ținta i686-win7-windows-gnu.
    container: archlinux:latest
    env:
      # Relativ la rădăcina repo-ului (scripturile fac cd acolo); în container
      # github.workspace ar da calea de pe gazdă, nu pe cea din container.
      ASSETS: assets
    steps:
      - name: Dependențe de sistem
        run: pacman -Syu --noconfirm --needed gcc mingw-w64-gcc p7zip zstd rustup git curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets
          path: assets
      - run: packaging/windows/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/instalator-*-windows.zip
          if-no-files-found: error

  linux:
    timeout-minutes: 45
    name: Linux x86_64
    needs: [version, assets]
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-22.04
    env:
      # Relativ la rădăcina repo-ului (scripturile fac cd acolo); în container
      # github.workspace ar da calea de pe gazdă, nu pe cea din container.
      ASSETS: assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependențe de sistem
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev zip
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets
          path: assets
      - run: packaging/linux/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: dist/instalator-*-linux.zip
          if-no-files-found: error

  release:
    timeout-minutes: 10
    name: GitHub Release
    # Doar la push pe main, cu toate build-urile și testele reușite.
    if: >-
      github.event_name == 'push' && needs.version.outputs.build == 'true' && !cancelled() &&
      needs.test.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success'
    needs: [version, test, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Sume de control
        working-directory: artifacts
        run: sha256sum -- * | tee SHA256SUMS.txt
      # Release-ul se creează ca draft, i se urcă fișierele și abia apoi se publică.
      - name: Publică release-ul
        working-directory: artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$VERSION"
          title="Instalator v$VERSION"
          notes="Pentru stick: instalator-$VERSION-windows.zip (Windows 8/10/11) sau instalator-$VERSION-linux.zip (Ubuntu, Mint, Q4OS, antiX pe 64 de biți). Se dezarhivează pe stick; instrucțiunile sunt în CITESTE.txt."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber -- *
            gh release edit "$tag" --title "$title" --target "$GITHUB_SHA" --notes "$notes"
          else
            gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" --notes "$notes" -- *
          fi
          gh release edit "$tag" --draft=false --latest
          {
            echo "Publicat **$title** la \`${GITHUB_SHA::9}\`:"
            echo
            sed 's/^/    /' SHA256SUMS.txt
          } >>"$GITHUB_STEP_SUMMARY"
